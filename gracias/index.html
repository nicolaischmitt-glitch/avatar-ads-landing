<style>
  /* ===== Branding Avatar Ads (mismos tokens que la landing) ===== */
  :root{
    --bg:#020604;
    --neon:#C5F740;
    --white:#F8F8F8;
    --text-2:#DDDAD7;
    --meta:#9F9587;
    --neon-soft:rgba(197,247,64,.12);
    --display:"Archivo", system-ui, sans-serif;
    --body:"Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, monospace;
    --gutter:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{min-height:100vh;min-height:100svh;background:var(--bg);color:var(--text-2);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;
    background-image:radial-gradient(90% 40% at 50% 0%, rgba(48,94,74,.35), transparent 70%)}
  .wrap{width:100%;max-width:520px;margin:0 auto;padding:0 var(--gutter)}

  .logo{display:flex;justify-content:center;padding:22px 0 8px}
  .logo img{display:block;height:44px;width:auto;mix-blend-mode:screen}

  .hero{text-align:center;padding:30px 0 44px}
  .check{width:64px;height:64px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--neon-soft);border:1px solid rgba(197,247,64,.5);box-shadow:0 0 30px -6px rgba(197,247,64,.5)}
  h1{font-family:var(--display);font-stretch:112%;color:var(--white);letter-spacing:-.025em;line-height:1.04;font-weight:800;font-size:clamp(32px,9vw,44px);margin:22px 0 14px}
  h1 .b{color:var(--neon)}
  .lead{font-size:17px}

  .btn{display:flex;text-decoration:none;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--neon);color:var(--bg);font-family:var(--display);font-stretch:108%;font-weight:800;font-size:18px;text-align:left;padding:19px 22px;border-radius:14px;margin-top:28px;
    box-shadow:0 0 0 1px rgba(197,247,64,.6), 0 14px 34px -14px rgba(197,247,64,.55);transition:transform .12s, filter .2s}
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translateY(2px)}
  .btn:focus-visible{outline:2px solid var(--white);outline-offset:3px}
  .btn svg{flex:none}
  .note{font-size:14px;margin-top:14px;color:var(--meta)}
</style>
</head>
<body>

<main class="wrap">
  <div class="logo"><img src="../logo-avatar-ads.webp" alt="Avatar Ads 1.0" width="900" height="330"></div>

  <section class="hero">
    <div class="check" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#C5F740" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1>¡Ya estás dentro de <span class="b">Avatar Ads</span>!</h1>
    <p class="lead">Escríbeme por WhatsApp para darte acceso.</p>
    <a class="btn" href="https://wa.me/593990763150?text=Hola%20Nicolai%2C%20acab%C3%A9%20de%20ingresar%20al%20sistema%2C%20por%20favor%2C%20%C2%BFme%20puedes%20dar%20acceso%3F" target="_blank" rel="noopener" id="btn-whatsapp">
      Pedir mi acceso por WhatsApp
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <p class="note">El mensaje ya va escrito: solo dale a enviar.</p>
  </section>
</main>

<script>
  // Evento propio para medir cuántos compradores piden acceso (no es una compra)
  document.getElementById("btn-whatsapp").addEventListener("click", () => { if (window.fbq) fbq("trackCustom", "ClicAccesoWhatsApp"); });
</script>
</body>
