<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex">

<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "z7lfue19rh");

<meta name="theme-color" content="#020604">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  :root{--bg:#020604;--bg-2:#090F0B;--neon:#C5F740;--white:#F8F8F8;--text-2:#DDDAD7;--meta:#9F9587;--line:rgba(48,94,74,.55);
    --display:"Archivo",system-ui,sans-serif;--body:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:
      radial-gradient(80% 45% at 50% 0%, rgba(48,94,74,.45), transparent 70%),
      linear-gradient(rgba(48,94,74,.14) 1px, transparent 1px) 0 0/100% 44px, var(--bg);
    color:var(--text-2);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  .wrap{max-width:960px;margin:0 auto;padding:14px 16px 48px;text-align:center}
  .logo img{display:block;margin:0 auto;height:44px;width:auto;mix-blend-mode:screen}
  h1{font-family:var(--display);font-stretch:112%;font-weight:800;color:var(--white);letter-spacing:-.025em;line-height:1.04;font-size:clamp(26px,5.4vw,42px);margin:22px auto 22px;max-width:760px}
  h1 .b{color:var(--neon)}

  /* reproductor: sin barra para adelantar */
  .vid{position:relative;width:100%;aspect-ratio:16/9;margin:0 auto 22px;border-radius:16px;border:1px solid var(--line);background:#000;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .vid video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  .vid:fullscreen{border-radius:0;border:0}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(2,6,4,.45);cursor:pointer;border:0;color:var(--white);font:inherit;width:100%}
  .ov[hidden]{display:none}
  .ov .pl{width:84px;height:84px;border-radius:50%;background:var(--neon);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(197,247,64,.18),0 14px 34px rgba(0,0,0,.6)}
  .ov .pl svg{width:34px;height:34px;margin-left:5px}
  .ov .tx{font-family:var(--display);font-stretch:108%;font-weight:800;font-size:clamp(16px,2.6vw,22px);text-shadow:0 2px 12px rgba(0,0,0,.7)}
  .bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.12);pointer-events:none}
  .bar i{display:block;height:100%;width:0;background:var(--neon)}
  .ctl{position:absolute;right:10px;bottom:14px;display:flex;gap:8px;opacity:0;transition:opacity .25s}
  .vid:hover .ctl,.vid.toque .ctl,.vid.pausa .ctl{opacity:1}
  .ctl button{width:40px;height:40px;border-radius:10px;border:0;background:rgba(2,6,4,.7);color:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .ctl svg{width:20px;height:20px}
  .vid .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--meta);font-size:13px;pointer-events:none}
  .vid.vacio .ph{display:flex}

  /* El botón existe en la página pero está oculto hasta que pasa el tiempo */
  .btn{display:none;align-items:center;justify-content:center;gap:10px;width:100%;max-width:560px;margin:0 auto;text-decoration:none;background:var(--neon);color:var(--bg);font-family:var(--display);font-stretch:108%;font-weight:800;font-size:18px;padding:19px 22px;border-radius:14px;
    box-shadow:0 0 0 1px rgba(197,247,64,.6),0 14px 34px -14px rgba(197,247,64,.55);transition:transform .12s,filter .2s}
  .btn.ver{display:flex;animation:ent .6s ease both}
  .btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(2px)}
  .btn:focus-visible{outline:2px solid var(--white);outline-offset:3px}
  @keyframes ent{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.btn.ver{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="logo"><img src="../logo-avatar-ads.webp" alt="Avatar Ads"></div>

  <!-- Título provisional (el copy se ajusta al final) -->
  <h1>Mira cómo se crea un <span class="b">anuncio con IA</span>, de la idea al video final.</h1>

  <div class="vid" id="vid">
    <video id="v" playsinline preload="metadata" poster="poster.jpg" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback"></video>
    <div class="bar"><i id="bar"></i></div>
    <div class="ctl">
      <button type="button" id="snd" aria-label="Silenciar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path id="sndw" d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg></button>
      <button type="button" id="fs" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <button type="button" class="ov" id="ov" aria-label="Reproducir">
      <span class="pl"><svg viewBox="0 0 24 24" fill="#020604"><path d="M6 4l14 8-14 8z"/></svg></span>
      <span class="tx" id="ovt">Haz clic para ver el entrenamiento</span>
    </button>
    <span class="ph">Video no disponible</span>
  </div>

  <a class="btn" id="cta" href="https://avatarads.droilab.com/">Quiero el sistema</a>
</main>

<script>
(function(){
  var ESPERA = 120;   // segundos hasta que aparece el botón
  var VENTA  = "https://avatarads.droilab.com/";
  var q = new URLSearchParams(location.search);
  var v = (q.get("v") || "").toUpperCase();
  if (v !== "A" && v !== "B") { try { v = localStorage.getItem("aa_var_titulo") || ""; } catch(e){} }
  var espera = parseInt(q.get("t"), 10); if (!(espera >= 0)) espera = ESPERA;   // ?t=5 para probar

  // El botón lleva a la landing de venta con los parámetros de la visita
  var cta = document.getElementById("cta"), url = new URL(VENTA);
  ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","fbclid"].forEach(function(k){ if (q.get(k)) url.searchParams.set(k, q.get(k)); });
  if (v) url.searchParams.set("var_titulo", v);
  cta.href = url.href;

  // Cuenta desde la primera visita: recargar la página no reinicia el tiempo
  var ini = Date.now();
  try { var g = parseInt(sessionStorage.getItem("aa_demo_ini"), 10); if (g) ini = g; else sessionStorage.setItem("aa_demo_ini", ini); } catch(e){}
  var mostrado = false;
  function mostrar(){
    if (mostrado) return; mostrado = true;
    cta.classList.add("ver");
    if (window.fbq) fbq("trackCustom", "BotonDemoVisible", {variante: v});
    if (window.clarity) clarity("event", "demo_boton_visible");
  }
  (function tick(){
    if ((Date.now() - ini) / 1000 >= espera) return mostrar();
    setTimeout(tick, 500);
  })();
  cta.addEventListener("click", function(){
    if (window.fbq) fbq("trackCustom", "ClicDemoAVenta", {variante: v});
    if (window.clarity) clarity("event", "demo_clic_venta");
  });

  // ── Reproductor del VSL ──
  // · no se puede adelantar: si alguien salta hacia adelante, vuelve a lo que ya vio
  // · si se va y vuelve, sigue desde donde lo dejó (se guarda en este navegador)
  // · retención: eventos de Clarity (vsl_5 … vsl_100) y una etiqueta con el % máximo visto
  var SRC = "vsl/index.m3u8", K_POS = "aa_vsl_pos", K_MAX = "aa_vsl_max";
  var box = document.getElementById("vid"), vid = document.getElementById("v"), ov = document.getElementById("ov"), ovt = document.getElementById("ovt");
  var bar = document.getElementById("bar"), snd = document.getElementById("snd"), sndw = document.getElementById("sndw"), fs = document.getElementById("fs");
  var leer = function(k){ try { return parseFloat(localStorage.getItem(k)) || 0; } catch(e){ return 0; } };
  var guardar = function(k, x){ try { localStorage.setItem(k, String(Math.round(x * 10) / 10)); } catch(e){} };
  var pos = leer(K_POS), max = Math.max(leer(K_MAX), pos), arrancado = false, ultimoGuardado = 0;

  if (vid.canPlayType("application/vnd.apple.mpegurl")) vid.src = SRC;
  else if (window.Hls && Hls.isSupported()) { var hls = new Hls({ startPosition: pos > 2 ? pos : -1, capLevelToPlayerSize: true }); hls.loadSource(SRC); hls.attachMedia(vid); }
  else box.classList.add("vacio");
  vid.addEventListener("error", function(){ box.classList.add("vacio"); });

  if (pos > 5) ovt.textContent = "Continuar desde donde lo dejaste";

  function iniciar(){
    vid.muted = false;
    if (!arrancado) {
      arrancado = true;
      if (pos > 2 && vid.duration && pos < vid.duration - 3) { try { vid.currentTime = pos; } catch(e){} }
      if (window.clarity) clarity("event", pos > 5 ? "vsl_reanuda" : "vsl_play");
      if (window.fbq) fbq("trackCustom", "DemoPlay", {variante: v});
    }
    var p = vid.play(); if (p && p.catch) p.catch(function(){ ov.hidden = false; });
  }
  ov.addEventListener("click", iniciar);
  vid.addEventListener("loadedmetadata", function(){
    if (pos > 2 && pos < vid.duration - 3 && Math.abs(vid.currentTime - pos) > 1) { try { vid.currentTime = pos; } catch(e){} }
    if (pos >= vid.duration - 3) { pos = 0; ovt.textContent = "Ver de nuevo"; }
    pintar();
  });
  // clic sobre el video = pausa / sigue
  vid.addEventListener("click", function(){ if (vid.paused) iniciar(); else vid.pause(); });
  vid.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  vid.addEventListener("play", function(){ ov.hidden = true; box.classList.remove("pausa"); });
  vid.addEventListener("pause", function(){ box.classList.add("pausa"); guardar(K_POS, vid.currentTime); });
  vid.addEventListener("ended", function(){ guardar(K_POS, 0); ov.hidden = false; ovt.textContent = "Ver de nuevo"; });
  box.addEventListener("touchstart", function(){ box.classList.add("toque"); clearTimeout(box._t); box._t = setTimeout(function(){ box.classList.remove("toque"); }, 2500); }, {passive: true});

  // no se puede adelantar (tampoco desde la pantalla completa del iPhone)
  vid.addEventListener("seeking", function(){
    if (vid.currentTime > max + 1.5) vid.currentTime = max;
  });
  vid.addEventListener("ratechange", function(){ if (vid.playbackRate !== 1) vid.playbackRate = 1; });

  // progreso: la barra avanza rápido al principio y luego más lento (como en el VSL de la landing)
  function pintar(){ var x = vid.duration ? vid.currentTime / vid.duration : 0; bar.style.width = (100 * (1 - Math.pow(1 - x, 2))).toFixed(2) + "%"; }
  var HITOS = [5, 10, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90, 95, 100], hechos = {};
  try { hechos = JSON.parse(localStorage.getItem("aa_vsl_hitos") || "{}"); } catch(e){}
  vid.addEventListener("timeupdate", function(){
    var t = vid.currentTime;
    if (!vid.seeking && t > max && t - max < 3) max = t;
    pintar();
    if (Math.abs(t - ultimoGuardado) >= 2) { ultimoGuardado = t; guardar(K_POS, t); guardar(K_MAX, max); }
    if (!vid.duration) return;
    var pct = Math.floor(100 * max / vid.duration + 0.5);
    HITOS.forEach(function(h){
      if (pct >= h && !hechos[h]) {
        hechos[h] = 1; try { localStorage.setItem("aa_vsl_hitos", JSON.stringify(hechos)); } catch(e){}
        if (window.clarity) { clarity("event", "vsl_" + h); clarity("set", "vsl_pct", String(h)); }
        if (window.fbq && (h === 25 || h === 50 || h === 75 || h === 95)) fbq("trackCustom", "VSL" + h, {variante: v});
      }
    });
  });

  // al salir de la página se guarda y se pausa; al volver sigue donde iba
  var seguia = false;
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) { seguia = !vid.paused; guardar(K_POS, vid.currentTime); guardar(K_MAX, max); if (seguia) vid.pause(); }
    else if (seguia) { seguia = false; iniciar(); }
  });
  window.addEventListener("pagehide", function(){ guardar(K_POS, vid.currentTime); guardar(K_MAX, max); });

  // sonido y pantalla completa
  snd.addEventListener("click", function(e){ e.stopPropagation(); vid.muted = !vid.muted; sndw.style.display = vid.muted ? "none" : ""; });
  fs.addEventListener("click", function(e){
    e.stopPropagation();
    if (document.fullscreenElement) return document.exitFullscreen();
    if (box.requestFullscreen) box.requestFullscreen();
    else if (box.webkitRequestFullscreen) box.webkitRequestFullscreen();
    else if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
  });
})();
</script>
<!-- Conteo de visitas (dashboard interno): fecha, página, origen y versión del título. Sin datos personales. -->
<script>
(function(){
  try {
    var q = new URLSearchParams(location.search);
    if (q.get("nocontar") === "1") { localStorage.setItem("aa_no_contar", "1"); }   // abre la página con ?nocontar=1 una vez: ese navegador no se cuenta
    if (localStorage.getItem("aa_no_contar") || navigator.webdriver || /bot|crawl|spider|headless|lighthouse/i.test(navigator.userAgent)) return;
    var id = localStorage.getItem("aa_visitante");
    if (!id) { id = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); localStorage.setItem("aa_visitante", id); }
    var src = (q.get("utm_source") || "").toLowerCase();
    if (src) localStorage.setItem("aa_fuente", src); else src = localStorage.getItem("aa_fuente") || "";
    var v = (q.get("v") || "").toUpperCase();
    if (v !== "A" && v !== "B") v = localStorage.getItem("aa_var_titulo") || "";
    fetch("https://n8n-visasidv.onrender.com/webhook/avatar-ads-registro", { method: "POST", mode: "no-cors", keepalive: true,
      body: new URLSearchParams({ paso: "visita", pagina: location.pathname, fuente: src, variante: v, visitante: id }) });
  } catch (e) {}
})();
</script>
</body>
</html>
