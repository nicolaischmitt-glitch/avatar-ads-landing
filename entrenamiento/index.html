<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex">

<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;

<meta name="theme-color" content="#020604">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#020604;--bg-2:#090F0B;--neon:#C5F740;--white:#F8F8F8;--text-2:#DDDAD7;--meta:#9F9587;--forest:#305E4A;--line:rgba(48,94,74,.55);
    --display:"Archivo",system-ui,sans-serif;--body:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:
      radial-gradient(80% 45% at 50% 0%, rgba(48,94,74,.45), transparent 70%),
      linear-gradient(rgba(48,94,74,.14) 1px, transparent 1px) 0 0/100% 44px, var(--bg);
    color:var(--text-2);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:14px 20px 48px;text-align:center}
  .logo img{display:block;margin:0 auto;height:44px;width:auto;mix-blend-mode:screen}
  h1{font-family:var(--display);font-stretch:112%;font-weight:800;color:var(--white);letter-spacing:-.025em;line-height:1.04;font-size:clamp(30px,8.6vw,46px);margin:26px 0 14px}
  h1 .b{color:var(--neon)}
  .sub{font-size:17px;color:var(--text-2);margin-bottom:26px}
  .img{display:block;width:100%;aspect-ratio:16/9;border-radius:16px;border:1px solid var(--line);background:var(--bg-2) center/cover no-repeat;position:relative;overflow:hidden;margin-bottom:22px;padding:0}
  .img img{width:100%;height:100%;object-fit:cover;display:block}
  .img .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--meta);font-size:13px}
  .img.vacia .ph{display:flex}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--neon);color:var(--bg);font-family:var(--display);font-stretch:108%;font-weight:800;font-size:18px;padding:19px 22px;border-radius:14px;
    box-shadow:0 0 0 1px rgba(197,247,64,.6),0 14px 34px -14px rgba(197,247,64,.55);transition:transform .12s,filter .2s}
  .btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(2px)}
  .btn:focus-visible,.img:focus-visible{outline:2px solid var(--white);outline-offset:3px}
  .btn[disabled]{opacity:.6;cursor:wait}
  /* pop-up */
  dialog{margin:auto;width:calc(100% - 32px);max-width:440px;background:var(--bg-2);color:var(--text-2);border:1px solid var(--line);border-radius:18px;padding:26px 22px 22px;box-shadow:0 30px 80px -20px #000}
  dialog::backdrop{background:rgba(0,0,0,.75);backdrop-filter:blur(3px)}
  dialog h2{font-family:var(--display);font-stretch:110%;font-weight:800;color:var(--white);font-size:24px;line-height:1.1;letter-spacing:-.02em;margin-bottom:6px}
  dialog p.s{font-size:14px;color:var(--meta);margin-bottom:18px}
  .x{position:absolute;top:10px;right:12px;width:36px;height:36px;font-size:24px;color:var(--meta);line-height:1}
  label{display:block;text-align:left;font-size:13px;color:var(--meta);margin:0 0 5px}
  input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--white);font:inherit;font-size:16px;padding:14px;margin-bottom:14px}
  input:focus{outline:2px solid var(--neon);outline-offset:1px}
  .tel{display:flex;gap:8px;margin-bottom:14px}
  .tel input{margin-bottom:0;flex:1;min-width:0}
  select{flex:0 0 50%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--white);font:inherit;font-size:15px;padding:14px 4px 14px 10px}
  select:focus{outline:2px solid var(--neon);outline-offset:1px}
  .priv{font-size:12.5px;color:var(--meta);margin-top:12px;line-height:1.4}
  .hp{position:absolute;left:-9999px;opacity:0}
  .err{color:#ff8a7a;font-size:14px;min-height:20px;margin:-4px 0 10px;text-align:left}
</style>
</head>
<body>
<main class="wrap">
  <div class="logo"><img src="../logo-avatar-ads.webp" alt="Avatar Ads"></div>

  <!-- BORRADORES de título: pendientes de aprobar con el skill copy-avatar-ads -->
  <h1 id="titulo" data-a="El sistema para crear <span class='b'>anuncios con IA</span> que escalan tus ventas." data-b="Crea <span class='b'>anuncios con IA</span> 13 veces más baratos, sin grabarte ni editar."></h1>
  <p class="sub">Mira gratis, paso a paso, cómo se crea un anuncio hiperrealista con el sistema, de la idea al video final.</p>

  <!-- Imagen: poner el archivo en landing/entrenamiento/imagen.webp -->
  <button type="button" class="img abrir" aria-label="Quiero ver el entrenamiento gratis">
    <img src="imagen.webp" alt="" onerror="this.parentNode.classList.add('vacia');this.remove()">
    <span class="ph">imagen.webp pendiente</span>
  </button>

  <button type="button" class="btn abrir">Quiero ver el entrenamiento gratis</button>
</main>

<dialog id="pop">
  <button type="button" class="x" id="cerrar" aria-label="Cerrar">×</button>
  <h2>¿A dónde te enviamos el entrenamiento?</h2>
  <p class="s">Déjanos tus datos y accedes al instante.</p>
  <form id="form" novalidate>
    <label for="nombre">Nombre</label>
    <input id="nombre" name="nombre" type="text" autocomplete="given-name" required>
    <label for="correo">Correo</label>
    <input id="correo" name="correo" type="email" autocomplete="email" inputmode="email" required>
    <label for="wa">Celular</label>
    <div class="tel">
      <select id="pais" aria-label="País"></select>
      <input id="wa" name="whatsapp" type="tel" autocomplete="tel-national" inputmode="tel" placeholder="99 123 4567" required>
    </div>
    <input class="hp" name="web" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="err" id="err" role="alert"></div>
    <button type="submit" class="btn" id="enviar">Acceder ahora</button>
    <p class="priv">Usamos tus datos solo para enviarte el entrenamiento. Tu correo está a salvo y no recibirás spam.</p>
  </form>
</dialog>

<script>
(function(){
  // ====== Configuración ======
  var ENDPOINT  = "https://script.google.com/macros/s/AKfycbz0lY2NMu5_wGg07_QAD2YsIgcH6QQIgdaEN0wQbVM1KUQSOqL3jwGecjt1Q68HFks/exec";          // URL de la aplicación web de Google Apps Script (tracking/registro/LEEME.md)
  var SIGUIENTE = "../demo/";    // página del entrenamiento (video demo); por crear
  var VARIANTES = ["A","B"];

  // ====== A/B test del título (50/50, se recuerda en el navegador; ?v=A o ?v=B para previsualizar) ======
  var q = new URLSearchParams(location.search), v = (q.get("v")||"").toUpperCase();
  if (VARIANTES.indexOf(v) < 0) {
    try { v = localStorage.getItem("aa_var_titulo"); } catch(e){}
    if (VARIANTES.indexOf(v) < 0) v = VARIANTES[Math.random() < .5 ? 0 : 1];
    try { localStorage.setItem("aa_var_titulo", v); } catch(e){}
  }
  var h1 = document.getElementById("titulo");
  h1.innerHTML = h1.getAttribute("data-" + v.toLowerCase());
  if (window.clarity) clarity("set", "variante_titulo", v);

  // ====== País y código de marcación ======
  var PAISES = [["EC","Ecuador","593"],["CO","Colombia","57"],["MX","México","52"],["PE","Perú","51"],["CL","Chile","56"],["AR","Argentina","54"],["BO","Bolivia","591"],["VE","Venezuela","58"],["UY","Uruguay","598"],["PY","Paraguay","595"],["PA","Panamá","507"],["CR","Costa Rica","506"],["GT","Guatemala","502"],["SV","El Salvador","503"],["HN","Honduras","504"],["NI","Nicaragua","505"],["DO","Rep. Dominicana","1"],["PR","Puerto Rico","1"],["CU","Cuba","53"],["ES","España","34"],["US","Estados Unidos","1"],["CA","Canadá","1"],["BR","Brasil","55"],["GB","Reino Unido","44"],["FR","Francia","33"],["DE","Alemania","49"],["IT","Italia","39"],["PT","Portugal","351"]];
  var sel = document.getElementById("pais");
  PAISES.forEach(function(p){ var o = document.createElement("option"); o.value = p[0]; o.setAttribute("data-c", p[2]); o.textContent = p[1] + " +" + p[2]; sel.appendChild(o); });
  function poner(cc){ cc = (cc||"").toUpperCase(); if (PAISES.some(function(p){ return p[0] === cc; })) { sel.value = cc; return true; } return false; }
  // 1) idioma del navegador (inmediato)  2) IP del visitante (api.country.is, gratis), que corrige si acierta
  var reg = ((navigator.language||"").split("-")[1]||""); if (!poner(reg)) sel.value = "EC";
  var tocado = false; sel.addEventListener("change", function(){ tocado = true; });
  try { fetch("https://api.country.is/").then(function(r){ return r.json(); }).then(function(d){ if (!tocado && d && d.country) poner(d.country); }).catch(function(){}); } catch(e){}

  // ====== Pop-up ======
  var pop = document.getElementById("pop"), form = document.getElementById("form"), err = document.getElementById("err"), btn = document.getElementById("enviar");
  document.querySelectorAll(".abrir").forEach(function(b){ b.addEventListener("click", function(){
    pop.showModal();
    if (window.fbq) fbq("trackCustom", "AbrirRegistro", {variante: v});
    if (window.clarity) clarity("event", "abrir_registro_" + v);
  }); });
  document.getElementById("cerrar").addEventListener("click", function(){ pop.close(); });
  pop.addEventListener("click", function(e){ if (e.target === pop) pop.close(); });

  // ====== Envío ======
  form.addEventListener("submit", function(e){
    e.preventDefault(); err.textContent = "";
    var d = new FormData(form);
    if (d.get("web")) return;  // trampa para bots
    var nombre = (d.get("nombre")||"").trim(), correo = (d.get("correo")||"").trim(), raw = (d.get("whatsapp")||"").trim(), wa;
    if (raw.charAt(0) === "+") wa = raw.replace(/\D/g,"");                       // si escribe el número completo con +, se respeta
    else wa = sel.options[sel.selectedIndex].getAttribute("data-c") + raw.replace(/\D/g,"").replace(/^0+/,"");   // código del país + número sin el 0 inicial
    if (!nombre) { err.textContent = "Escribe tu nombre."; return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)) { err.textContent = "Revisa tu correo."; return; }
    if (wa.length < 9 || wa.length > 15) { err.textContent = "Revisa tu número de WhatsApp."; return; }
    if (!ENDPOINT) { err.textContent = "Falta conectar la hoja (ENDPOINT)."; return; }
    btn.disabled = true; btn.textContent = "Enviando…";
    var body = new URLSearchParams({
      nombre: nombre, correo: correo, whatsapp: wa, variante: v,
      fuente: q.get("utm_source")||"", medio: q.get("utm_medium")||"", campana: q.get("utm_campaign")||"", anuncio: q.get("utm_content")||"", fbclid: q.get("fbclid")||""
    });
    var ir = function(){
      if (window.fbq) fbq("track", "Lead", {content_name: "Entrenamiento gratis", variante: v});
      if (window.clarity) clarity("event", "lead_" + v);
      var next = new URL(SIGUIENTE, location.href); next.searchParams.set("v", v);
      setTimeout(function(){ location.href = next.href; }, 250);
    };
    fetch(ENDPOINT, {method: "POST", mode: "no-cors", body: body}).then(ir).catch(function(){
      btn.disabled = false; btn.textContent = "Acceder ahora"; err.textContent = "No se pudo enviar. Inténtalo otra vez.";
    });
  });
})();
</script>
</body>
</html>
